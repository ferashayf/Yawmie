<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yawmie Plan Demo</title>
<style>
/* Ideas taken from Anchor (time-blocking planner), rebuilt in Yawmie's look. Fake data only. */
:root {
  --accent: #0F8F7A; --accent2: #7A1F2B; --bg1: #F4F4F2; --bg2: #E8E8E4;
  --glow: rgba(15, 143, 122, .26); --haze: rgba(122, 31, 43, .2);
  --glass: rgba(255, 255, 255, .5); --glass-strong: rgba(246, 246, 244, .92); --edge: rgba(255, 255, 255, .95);
  --stroke: rgba(14, 14, 14, .08); --ink: #0E0E0E; --sub: #5A5A5A; --chip: rgba(14, 14, 14, .055); --track: rgba(14, 14, 14, .09);
  --warn: #B7791F; --over: #C2412D; --stage: #E3E3DF; --stage-ink: #0E0E0E;
  --shadow: 0 12px 32px -12px rgba(40, 24, 24, .22), 0 1px 2px rgba(0, 0, 0, .04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "Geeza Pro", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #2BB59D; --accent2: #C04459; --bg1: #0E0E0E; --bg2: #1E1E1E; --glow: rgba(43, 181, 157, .24); --haze: rgba(192, 68, 89, .26);
    --glass: rgba(255, 255, 255, .06); --glass-strong: rgba(30, 26, 28, .94); --edge: rgba(255, 255, 255, .14); --stroke: rgba(255, 255, 255, .08);
    --ink: #F4F4F2; --sub: #BDBDBD; --chip: rgba(255, 255, 255, .08); --track: rgba(255, 255, 255, .1); --warn: #E0A43A; --over: #EF6A52;
    --stage: #151515; --stage-ink: #F4F4F2; --shadow: 0 12px 32px -12px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: #2BB59D; --accent2: #C04459; --bg1: #0E0E0E; --bg2: #1E1E1E; --glow: rgba(43, 181, 157, .24); --haze: rgba(192, 68, 89, .26);
  --glass: rgba(255, 255, 255, .06); --glass-strong: rgba(30, 26, 28, .94); --edge: rgba(255, 255, 255, .14); --stroke: rgba(255, 255, 255, .08);
  --ink: #F4F4F2; --sub: #BDBDBD; --chip: rgba(255, 255, 255, .08); --track: rgba(255, 255, 255, .1); --warn: #E0A43A; --over: #EF6A52;
  --stage: #151515; --stage-ink: #F4F4F2; --shadow: 0 12px 32px -12px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--stage); color: var(--stage-ink); font-family: var(--font); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 16px; background: color-mix(in srgb, var(--stage) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.bar h1 { margin: 0; font-size: 16px; font-weight: 700; }
.bar h1 small { color: var(--sub); font-weight: 500; }
.bar .ctl { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); }
.seg button { min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; color: var(--sub); }
.seg button.on { background: var(--ink); color: var(--bg1); }
.pill-btn { min-height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; background: var(--chip); font-size: 14px; }

.stage { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; padding: 16px 16px 48px; }

/* ---------- phone ---------- */
.phone { position: relative; width: 100%; max-width: 400px; height: min(820px, calc(100dvh - 90px)); min-height: 600px; overflow: hidden; border-radius: 48px; color: var(--ink);
  box-shadow: 0 0 0 10px #0A0A0B, 0 0 0 11px #2A2A30, 0 40px 80px -30px rgba(0, 0, 0, .6);
  background: radial-gradient(120% 50% at 50% -10%, var(--glow), transparent 62%), radial-gradient(90% 40% at 100% 105%, var(--haze), transparent 70%), linear-gradient(180deg, var(--bg1), var(--bg2)); }
@media (max-width: 520px) { .phone { border-radius: 0; box-shadow: none; max-width: none; height: calc(100dvh - 60px); min-height: 0; } .stage { padding: 0 0 40px; } }
.scr { position: absolute; inset: 0; overflow-y: auto; padding: max(18px, env(safe-area-inset-top)) 16px 120px; scrollbar-width: none; }
.scr::-webkit-scrollbar { display: none; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); border: 1px solid var(--stroke); box-shadow: inset 0 1px 0 var(--edge), var(--shadow); border-radius: 26px; }

/* date header */
.dhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 8px 4px 12px; }
.dhead .wd { font-size: 32px; font-weight: 800; line-height: 1; display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent2); display: inline-block; box-shadow: 0 0 10px var(--accent2); }
.dhead .mo { color: var(--sub); font-size: 15px; }
.dhead .dn { font-size: 46px; font-weight: 800; line-height: .9; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.safe { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 12px; }
.safe span { color: var(--sub); font-size: 13px; }
.safe b { font-size: 17px; }
.safe b.neg { color: var(--over); }

/* area chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--stroke); display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip small { color: var(--sub); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.chip.on small { color: rgba(255, 255, 255, .8); }
.chip.add { color: var(--sub); }

h3.sec { margin: 14px 4px 8px; font-size: 13px; font-weight: 700; color: var(--sub); display: flex; justify-content: space-between; }
h3.sec.late { color: var(--over); }

/* task rows */
.list { padding: 4px 0; }
.task { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 14px; }
.task + .task { border-top: 1px solid var(--stroke); }
.ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--sub); flex: none; display: grid; place-items: center; }
.ck.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.task .tt { flex: 1; min-width: 0; }
.task .tt div { overflow-wrap: anywhere; }
.task .tt small { color: var(--sub); font-size: 12.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.task .tt small i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); display: inline-block; }
.task.done .tt div { text-decoration: line-through; color: var(--sub); }
.flag { color: var(--accent2); font-weight: 800; }
.lateTxt { color: var(--over); }
.newrow { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 14px; border-top: 1px solid var(--stroke); }
.newrow input { flex: 1; border: 0; background: transparent; min-width: 0; padding: 10px 0; }
.newrow input:focus { outline: none; }
.plus { width: 26px; height: 26px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; color: var(--sub); flex: none; font-weight: 700; }

/* timeline */
.tl { position: relative; padding-block: 8px; }
.hr { position: absolute; inset-inline: 0; border-top: 1px solid var(--stroke); }
.hr span { position: absolute; inset-inline-start: 0; top: -9px; font-size: 11px; color: var(--sub); background: transparent; }
.blk { position: absolute; inset-inline: 46px 0; border-radius: 16px; padding: 8px 12px; overflow: hidden; text-align: start; border: 1px solid var(--stroke);
  background: color-mix(in srgb, var(--c) 18%, var(--glass)); border-inline-start: 4px solid var(--c); display: grid; align-content: start; gap: 2px; }
.blk b { font-size: 14px; display: flex; gap: 6px; align-items: center; }
.blk small { color: var(--sub); font-size: 12px; }
.blk .mini { font-size: 12.5px; color: var(--ink); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.past { opacity: .55; }
.blk.drop { outline: 2px dashed var(--accent); }
.now { position: absolute; inset-inline: 40px 0; height: 2px; background: var(--accent2); z-index: 2; pointer-events: none; }
.now::before { content: ""; position: absolute; inset-inline-start: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent2); }
.pray { position: absolute; inset-inline: 46px 0; border-top: 1px dashed color-mix(in srgb, var(--accent2) 60%, transparent); z-index: 1; pointer-events: none; }
.pray span { position: absolute; inset-inline-end: 4px; top: -8px; font-size: 10.5px; color: var(--accent2); background: var(--bg1); padding: 0 4px; border-radius: 6px; }

/* dock */
.dock { position: absolute; inset-inline: 14px; bottom: 18px; display: flex; gap: 8px; align-items: center; z-index: 5; direction: ltr; }
.buddy { width: 58px; height: 58px; border-radius: 50%; flex: none; overflow: hidden; display: grid; place-items: end center; }
.buddy img { width: 46px; }
.tabbar { flex: 1; height: 58px; padding: 5px; border-radius: 30px; display: flex; }
[dir="rtl"] .tabbar { direction: rtl; }
.tabbar button { flex: 1; border-radius: 24px; font-size: 11.5px; color: var(--sub); display: grid; place-items: center; }
.tabbar button.on { background: var(--chip); color: var(--ink); font-weight: 700; }
.fab { width: 58px; height: 58px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 30px; font-weight: 300; background: radial-gradient(120% 90% at 30% 10%, rgba(255, 255, 255, .3), transparent 55%), var(--accent2); box-shadow: 0 12px 26px -8px var(--accent2); }

/* sheet */
.ov { position: absolute; inset: 0; z-index: 10; background: rgba(10, 8, 8, .3); display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 90%; overflow-y: auto; background: var(--glass-strong); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); border-radius: 34px 34px 0 0; padding: 8px 16px 26px; display: grid; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--track); margin: 0 auto; }
.shead { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; }
.shead h2 { margin: 0; font-size: 18px; display: flex; gap: 8px; align-items: center; }
.rb { width: 44px; height: 44px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 18px; flex: none; }
.rb.ok { background: var(--accent); color: #fff; }
.rb:disabled { opacity: .35; cursor: default; }
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big2 button { min-height: 64px; border-radius: 20px; background: var(--chip); display: grid; place-items: center; gap: 2px; font-size: 14px; font-weight: 600; }
.big2 button.pri { background: var(--accent); color: #fff; }
.name-in { width: 100%; border: 0; background: transparent; font-size: 26px; font-weight: 800; padding: 6px 0; }
.name-in:focus { outline: none; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 40px; height: 40px; border-radius: 50%; background: var(--c); }
.sw.on { box-shadow: 0 0 0 3px var(--bg1), 0 0 0 5px var(--c); }
.icons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.ic { aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; background: var(--chip); }
.ic.on { background: var(--ink); color: var(--bg1); }
.ic svg, .chip svg, .blk svg { width: 20px; height: 20px; }
.blk svg, .chip svg { width: 15px; height: 15px; }
.cap-in { width: 100%; min-height: 56px; border-radius: 18px; border: 1px solid var(--stroke); background: var(--glass); padding: 12px 14px; font-size: 17px; }
.parsed { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { padding: 6px 10px; border-radius: 10px; background: var(--chip); font-size: 13px; }
.tag.k { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.hint { color: var(--sub); font-size: 13px; margin: 0; }
.err { color: var(--over); font-size: 13px; margin: 0; }
.ex { display: flex; gap: 6px; flex-wrap: wrap; }
.ex button { padding: 6px 10px; border-radius: 10px; background: var(--chip); font-size: 13px; }
.sel { width: 100%; min-height: 44px; border-radius: 14px; border: 1px solid var(--stroke); background: var(--glass); padding: 0 10px; }

/* focus */
.focus { position: absolute; inset: 0; z-index: 12; padding: 40px 18px 30px; display: grid; align-content: start; gap: 16px; overflow-y: auto;
  background: radial-gradient(90% 50% at 50% 0%, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%), linear-gradient(180deg, var(--bg1), var(--bg2)); }
.focus .arcw { position: relative; }
.focus svg.arc { width: 100%; height: auto; }
.focus .mid { position: absolute; inset-inline: 0; bottom: 6px; text-align: center; }
.focus .mid b { font-size: 34px; display: block; }
.focus .mid span { color: var(--sub); font-size: 13px; }
.wait { text-align: center; color: var(--sub); font-size: 14px; }
.endbtn { min-height: 52px; border-radius: 999px; background: var(--ink); color: var(--bg1); font-weight: 700; }

/* onboarding */
.ob { position: absolute; inset: 0; z-index: 15; display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(180deg, var(--bg1), var(--bg2)); }
.ob .prog { display: flex; gap: 6px; padding: 18px 22px 0; }
.ob .prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--track); }
.ob .prog i.on { background: var(--ink); }
.ob .body { padding: 20px 22px; display: grid; align-content: center; gap: 18px; overflow-y: auto; }
.ob h2 { margin: 0; font-size: 30px; font-weight: 800; line-height: 1.15; }
.ob h2 em { font-style: normal; color: var(--accent2); }
.ob p { margin: 0; color: var(--sub); }
.ob .vis { border-radius: 26px; padding: 16px; display: grid; gap: 8px; }
.ob .foot { display: flex; gap: 10px; padding: 0 22px 26px; }
.ob .next { flex: 1; min-height: 54px; border-radius: 999px; background: var(--ink); color: var(--bg1); font-weight: 700; }
.ob .back { width: 54px; height: 54px; border-radius: 50%; background: var(--chip); font-size: 20px; }
.say { display: flex; gap: 10px; align-items: flex-end; }
.say img { width: 52px; flex: none; }
.say div { border-radius: 18px; padding: 10px 14px; font-size: 14px; }
.clock { text-align: center; font-size: 52px; font-weight: 800; }
input[type=range] { width: 100%; accent-color: var(--accent2); height: 44px; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; }
.sw-t { width: 52px; height: 32px; border-radius: 16px; background: var(--track); position: relative; flex: none; }
.sw-t::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: inset-inline-start .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.sw-t.on { background: var(--accent); }
.sw-t.on::after { inset-inline-start: 23px; }

/* coach mark */
.coach { position: absolute; z-index: 14; inset-inline: 16px; border-radius: 20px; padding: 14px 16px; display: grid; gap: 10px; background: var(--ink); color: var(--bg1); box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .5); }
.coach .row { justify-content: space-between; }
.coach button { min-height: 40px; padding: 0 14px; border-radius: 999px; }
.coach .nx { background: var(--bg1); color: var(--ink); font-weight: 700; }
.coach::after { content: ""; position: absolute; inset-inline-start: var(--ax, 50%); width: 14px; height: 14px; background: var(--ink); transform: rotate(45deg); }
.coach.up::after { top: -6px; }
.coach.down::after { bottom: -6px; }
.ring { position: absolute; z-index: 13; border-radius: 22px; box-shadow: 0 0 0 3px var(--accent2), 0 0 0 9999px rgba(0, 0, 0, .35); pointer-events: none; }

.toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg1); font-size: 14px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

/* ---------- desktop ---------- */
.desk { width: 100%; max-width: 1240px; border-radius: 18px; overflow: hidden; color: var(--ink); box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .55), 0 0 0 1px var(--stroke);
  background: radial-gradient(70% 40% at 50% -10%, var(--glow), transparent 65%), radial-gradient(50% 40% at 100% 110%, var(--haze), transparent 70%), linear-gradient(180deg, var(--bg1), var(--bg2)); }
.desk .titlebar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; direction: ltr; border-bottom: 1px solid var(--stroke); }
.desk .titlebar i { width: 12px; height: 12px; border-radius: 50%; background: #BDBDBD; }
.desk .titlebar span { flex: 1; text-align: center; font-size: 13px; color: var(--sub); }
.dgrid { display: grid; grid-template-columns: 230px 1fr 270px; min-height: 660px; }
.side, .todo-col { padding: 16px; display: grid; align-content: start; gap: 12px; }
.side { border-inline-end: 1px solid var(--stroke); }
.todo-col { border-inline-start: 1px solid var(--stroke); }
.side h4, .todo-col h4 { margin: 4px 0 0; font-size: 12px; color: var(--sub); }
.side .area { min-height: 40px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; text-align: start; }
.side .area.on { background: var(--chip); font-weight: 700; }
.side .area i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.side .area span { flex: 1; }
.side .area small { color: var(--sub); }
.days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow-x: auto; }
.day { border-inline-end: 1px solid var(--stroke); min-width: 220px; }
.day:last-child { border-inline-end: 0; }
.day .dh { position: sticky; top: 0; padding: 14px 14px 10px; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--stroke); }
.day .dh b { font-size: 20px; }
.day .dh span { color: var(--sub); font-size: 13px; }
.day .dh .newb { min-height: 32px; padding: 0 10px; border-radius: 999px; background: var(--chip); font-size: 12.5px; }
.day .tl { margin: 10px 12px; }
.todo-col .task { background: var(--glass); border-radius: 14px; border: 1px solid var(--stroke); cursor: grab; }
.todo-col .task + .task { border-top: 1px solid var(--stroke); }
.todo-col .drop-zone { min-height: 60px; border-radius: 16px; border: 1px dashed var(--track); padding: 6px; display: grid; gap: 6px; align-content: start; }
.todo-col .drop-zone.drop { border-color: var(--accent); }
@media (max-width: 1000px) { .dgrid { grid-template-columns: 1fr; } .side, .todo-col { border: 0; } .days { grid-template-columns: repeat(3, 240px); } }

/* ---------- what we took ---------- */
.took { width: 100%; max-width: 1240px; color: var(--stage-ink); }
.took h2 { font-size: 22px; margin: 8px 0 4px; }
.took p.lead { color: var(--sub); margin: 0 0 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { border-radius: 20px; padding: 14px 16px; background: var(--glass); border: 1px solid var(--stroke); display: grid; gap: 6px; color: var(--ink); }
.card .from { font-size: 12px; color: var(--sub); }
.card b { font-size: 15px; }
.card .to { font-size: 14px; }
.card .to::before { content: "← "; color: var(--accent); font-weight: 700; }
[dir="ltr"] .card .to::before { content: "→ "; }
.card.skip .to::before { content: "✕ "; color: var(--over); }
.card.saudi { border-color: color-mix(in srgb, var(--accent2) 40%, transparent); }
.price { margin-top: 14px; border-radius: 20px; padding: 14px 16px; background: var(--glass); border: 1px solid var(--stroke); color: var(--ink); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="bar">
  <h1 id="ttl"></h1>
  <div class="ctl">
    <div class="seg" role="group" id="viewSeg"></div>
    <button class="pill-btn" id="langBtn" type="button"></button>
    <button class="pill-btn" id="themeBtn" type="button" aria-label="theme"></button>
    <button class="pill-btn" id="restartBtn" type="button"></button>
  </div>
</header>
<div class="stage">
  <div class="phone" id="phone"></div>
  <div class="desk" id="desk" hidden></div>
  <section class="took" id="took"></section>
</div>

<script>
(function () {
  'use strict';
  // ---------- strings ----------
  var S = {
    ar: {
      title: 'يومي', titleSub: '· أفكار مأخوذة من Anchor', phone: 'الجوال', desktop: 'الكمبيوتر', restart: 'من البداية', langBtn: 'EN',

    var foot = h('div', { class: 'foot' }, [
      i > 0 ? h('button', { type: 'button', class: 'back flipx', 'aria-label': 'back', text: st.lang === 'ar' ? '→' : '←', onclick: function () { st.ob--; render(); } }) : null,
      h('button', { type: 'button', class: 'next', text: i === OB_STEPS - 1 ? L().start : L().next, onclick: function () { st.ob = i === OB_STEPS - 1 ? -1 : i + 1; if (st.ob === -1) { st.coach = 1; scrolledOnce = false; } render(); } })
    ]);
    return h('div', { class: 'ob', role: 'dialog', 'aria-modal': 'true' }, [prog, body, foot]);
  }
  function obBlock(areaId, time, title) {
    var a = areaOf(areaId);
    return h('div', { class: 'blk', style: 'position:relative;inset:auto;--c:' + a.c }, [h('b', { html: icon(a.icon) }, [title]), h('small', { class: 'num', text: time })]);
  }

  // ---------- coach marks ----------
  var COACH_TARGETS = ['#tl', '#todo', '#fab'];
  function renderCoach() {
    if (st.coach <= 0 || st.ob >= 0 || st.sheet || st.focus) return;
    var target = phone.querySelector(COACH_TARGETS[st.coach - 1]);
    if (!target) return;
    target.scrollIntoView({ block: st.coach === 3 ? 'nearest' : 'center' });
    var pr = phone.getBoundingClientRect(), r = target.getBoundingClientRect();
    var top = r.top - pr.top, bottom = r.bottom - pr.top, isFab = st.coach === 3;
    var ringBox = isFab ? r : { left: r.left, top: r.top, width: r.width, height: Math.min(r.height, 260) };
    phone.appendChild(h('div', { class: 'ring', style: 'left:' + (ringBox.left - pr.left - 4) + 'px;top:' + (ringBox.top - pr.top - 4) + 'px;width:' + (ringBox.width + 8) + 'px;height:' + (ringBox.height + 8) + 'px' }));
    var below = !isFab && top < pr.height / 2;
    var c = h('div', { class: 'coach ' + (below ? 'up' : 'down'), role: 'dialog', style: (below ? 'top:' + Math.min(top + Math.min(r.height, 260) + 16, pr.height - 160) + 'px' : 'bottom:' + (pr.height - top + 16) + 'px') + ';--ax:' + (isFab ? (st.lang === 'ar' ? '86%' : '86%') : '40%') }, [
      h('div', { text: L().coach[st.coach - 1] }),
      h('div', { class: 'row' }, [h('button', { type: 'button', text: L().skip, onclick: function () { st.coach = 0; render(); } }),
        h('button', { type: 'button', class: 'nx', text: st.coach === 3 ? L().start : L().next, onclick: function () { st.coach = st.coach === 3 ? 0 : st.coach + 1; render(); } })])
    ]);
    phone.appendChild(c);
  }

  // ---------- desktop ----------
  var desk = document.getElementById('desk');
  function renderDesk() {
    desk.textContent = '';
    desk.appendChild(h('div', { class: 'titlebar' }, [h('i'), h('i'), h('i'), h('span', { text: 'yawmie.me' })]));
    var side = h('div', { class: 'side' }, [
      h('div', { class: 'dhead', style: 'padding:0' }, [h('div', {}, [h('div', { class: 'wd', style: 'font-size:24px' }, [new Intl.DateTimeFormat(loc(), { weekday: 'long' }).format(new Date()), h('span', { class: 'dot' })]),
        h('div', { class: 'mo', text: new Intl.DateTimeFormat(loc(), { day: 'numeric', month: 'long' }).format(new Date()) })])]),
      safeCard(), h('h4', { text: L().fArea })
    ]);
    [{ id: 'all', n: tx(S.ar.all, S.en.all), c: 'var(--sub)' }].concat(st.areas).forEach(function (a) {
      side.appendChild(h('button', { type: 'button', class: 'area' + (st.deskArea === a.id ? ' on' : ''), style: '--c:' + a.c, onclick: function () { st.deskArea = a.id; render(); } },
        [h('i'), h('span', { text: tr(a.n) }), h('small', { class: 'num', text: String(countArea(a.id)) })]));
    });
    side.appendChild(h('button', { type: 'button', class: 'area', onclick: function () { st.view = 'phone'; openSheet({ kind: 'area' }); } }, ['+ ' + L().newArea]));
    side.appendChild(h('div', { class: 'toggle', style: 'padding:6px 0' }, [h('span', { class: 'hint', text: L().prayersIdea }),
      h('button', { type: 'button', class: 'sw-t' + (st.prayers ? ' on' : ''), role: 'switch', 'aria-checked': st.prayers ? 'true' : 'false', 'aria-label': L().prayers, onclick: function () { st.prayers = !st.prayers; render(); } })]));

    var days = h('div', { class: 'days' });
    [0, 1, 2].forEach(function (off) {
      var d = dayDate(off);
      days.appendChild(h('div', { class: 'day' }, [
        h('div', { class: 'dh' }, [h('div', {}, [h('b', { text: L().dayRel[off] }), ' ', h('span', { class: 'num', text: new Intl.DateTimeFormat(loc(), { weekday: 'short', day: 'numeric' }).format(d) })]),
          h('button', { type: 'button', class: 'newb', text: L().newBlock, onclick: function () { addBlock(off); } })]),
        timeline(off, true)
      ]));
    });

    var dz = h('div', { class: 'drop-zone' });
    dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('drop'); });
    dz.addEventListener('dragleave', function () { dz.classList.remove('drop'); });
    dz.addEventListener('drop', function (e) { e.preventDefault(); assign(e.dataTransfer.getData('text/plain'), null); });
    var areaFilter = function (t) { return st.deskArea === 'all' || t.area === st.deskArea; };
    var lateList = st.tasks.filter(function (t) { return t.late && !t.done && areaFilter(t); });
    var todo = st.tasks.filter(function (t) { return !t.late && !placed(t).block && areaFilter(t); });
    lateList.concat(todo).forEach(function (t) { dz.appendChild(taskRow(t, { drag: true })); });
    dz.appendChild(h('p', { class: 'hint', text: L().dropHere }));
    var col = h('div', { class: 'todo-col' }, [h('h4', { text: L().todo + ' · ' + L().dragHint }), dz]);
    desk.appendChild(h('div', { class: 'dgrid' }, [side, days, col]));
  }
  function addBlock(off) {
    var used = st.blocks.filter(function (b) { return b.day === off; });
    var start = Math.max(st.dayStart * 60, off === 0 ? Math.ceil(nowMin() / 60) * 60 : st.dayStart * 60);
    while (used.some(function (b) { return start < b.start + b.len && start + 60 > b.start; })) start += 60;
    if (start + 60 > st.dayEnd * 60) return;
    var a = st.deskArea === 'all' ? st.areas[0] : areaOf(st.deskArea);
    st.blocks.push({ id: 'b' + (seq++), area: a.id, day: off, start: start, len: 60, t: tx('فترة ' + a.n.ar, a.n.en + ' block') });
    render(); toast(L().blockMade);
  }

  // ---------- what we took ----------
  function renderTook() {
    var el = document.getElementById('took'), t = L();
    el.textContent = '';
    el.appendChild(h('h2', { text: t.tookH }));
    el.appendChild(h('p', { class: 'lead', text: t.tookP }));
    el.appendChild(h('div', { class: 'cards' }, t.took.map(function (x) {
      return h('div', { class: 'card' + (x[2] ? ' ' + x[2] : '') }, [h('span', { class: 'from', text: x[2] === 'saudi' ? (st.lang === 'ar' ? 'لمسة سعودية' : 'Saudi twist') : 'Anchor' }), h('b', { text: x[0] }), h('div', { class: 'to', text: x[1] })]);
    })));
    el.appendChild(h('div', { class: 'price', html: t.price }));
    el.appendChild(h('h2', { text: t.skipH }));
    el.appendChild(h('div', { class: 'cards' }, t.skipped.map(function (x) { return h('div', { class: 'card skip' }, [h('b', { text: x[0] }), h('div', { class: 'to', text: x[1] })]); })));
  }

  // ---------- chrome ----------
  function setTheme(m) {
    st.theme = m;
    if (m === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', m);
    render();
  }
  function renderBar() {
    var t = L();
    document.documentElement.lang = st.lang;
    document.documentElement.dir = st.lang === 'ar' ? 'rtl' : 'ltr';
    var ttl = document.getElementById('ttl'); ttl.textContent = t.title + ' '; ttl.appendChild(h('small', { text: t.titleSub }));
    var seg = document.getElementById('viewSeg'); seg.textContent = '';
    ['phone', 'desktop'].forEach(function (v) { seg.appendChild(h('button', { type: 'button', class: st.view === v ? 'on' : '', 'aria-pressed': st.view === v ? 'true' : 'false', text: t[v], onclick: function () { st.view = v; render(); } })); });
    document.getElementById('langBtn').textContent = t.langBtn;
    document.getElementById('themeBtn').textContent = st.theme === 'dark' ? '☾' : st.theme === 'light' ? '☀︎' : '◐';
    document.getElementById('restartBtn').textContent = t.restart;
  }
  function render() {
    renderBar();
    phone.hidden = st.view !== 'phone';
    desk.hidden = st.view !== 'desktop';
    if (st.view === 'phone') renderPhone(); else renderDesk();
    renderTook();
  }
  document.getElementById('langBtn').addEventListener('click', function () {
    st.lang = st.lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem(LANG_KEY, st.lang); } catch (e) { /* storage blocked: language just resets next visit */ }
    render();
  });
  document.getElementById('themeBtn').addEventListener('click', function () { setTheme(st.theme === 'auto' ? 'dark' : st.theme === 'dark' ? 'light' : 'auto'); });
  document.getElementById('restartBtn').addEventListener('click', function () { st.ob = 0; st.coach = 0; st.sheet = null; st.focus = null; st.view = 'phone'; scrolledOnce = false; render(); });
  try { var saved = localStorage.getItem(LANG_KEY); if (saved === 'ar' || saved === 'en') st.lang = saved; } catch (e) { /* storage blocked: keep Arabic */ }
  setInterval(function () { if (!st.sheet && st.ob < 0 && st.coach === 0 && !document.activeElement.matches('input')) render(); }, 60000);
  render();
})();
</script>
</body>
</html>
