<!-- Yawmie: iOS 26 "Liquid Glass" concept screens (fake data). Rendered to PNG with headless Chrome. Open with #today, #details, #bills, #spending, #today-ar, #buddy-ar, or #board. -->
<meta charset="utf-8">
<title>Yawmie Glass Concepts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #E9E8E4; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "Geeza Pro", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 17px; line-height: 1.3;
    min-height: 100vh; display: grid; place-items: center; padding: 70px 64px;
  }
  body.board { display: grid; grid-template-columns: repeat(3, 430px); gap: 56px; justify-content: center; place-items: start; }

  /* ---------- tokens per screen theme ---------- */
  .light {
    --ink: #0E0E0E; --sub: #5A5A5A; --sub2: #9A9A98; --sep: rgba(14,14,14,.08);
    --glass: rgba(255,255,255,.34); --glass-hi: rgba(255,255,255,.4); --solid: rgba(255,255,255,.5);
    --rim: rgba(255,255,255,.95); --rim2: rgba(255,255,255,.35);
    --shadow: 0 12px 32px -10px rgba(40,24,24,.22), 0 1px 2px rgba(0,0,0,.04);
    --sel: rgba(14,14,14,.07); --track: rgba(14,14,14,.08); --contour: rgba(14,14,14,.07);
    --teal: #0F8F7A; --teal-soft: rgba(15,143,122,.13); --burg: #7A1F2B; --warn: #B7791F; --late: #C2412D;
    --base1: #F4F4F2; --base2: #E8E8E4; --glow-top: rgba(15,143,122,.34); --glow-bot: rgba(122,31,43,.26); --glow-mid: rgba(15,143,122,.12); --edge1: rgba(255,255,255,1); --edge2: rgba(255,255,255,.75);
    --dim: rgba(20,16,16,.22); --sheet: rgba(246,246,244,.86); --user: #0E0E0E; --user-ink: #F4F4F2;
    color-scheme: light;
  }
  .dark {
    --ink: #F4F4F2; --sub: #BDBDBD; --sub2: #77777A; --sep: rgba(255,255,255,.08);
    --glass: rgba(60,60,60,.34); --glass-hi: rgba(255,255,255,.07); --solid: rgba(52,52,52,.46);
    --rim: rgba(255,255,255,.2); --rim2: rgba(255,255,255,.05);
    --shadow: 0 12px 32px -10px rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.3);
    --sel: rgba(255,255,255,.12); --track: rgba(255,255,255,.1); --contour: rgba(255,255,255,.05);
    --teal: #2BB59D; --teal-soft: rgba(43,181,157,.16); --burg: #C04459; --warn: #D79A3A; --late: #E0614B;
    --base1: #0E0E0E; --base2: #1E1E1E; --glow-top: rgba(43,181,157,.22); --glow-bot: rgba(192,68,89,.26); --glow-mid: rgba(43,181,157,.08); --edge1: rgba(255,255,255,.4); --edge2: rgba(255,255,255,.18);
    --dim: rgba(0,0,0,.45); --sheet: rgba(30,30,30,.86); --user: #F4F4F2; --user-ink: #0E0E0E;
    color-scheme: dark;
  }

  /* ---------- device ---------- */
  .phone {
    width: 430px; height: 902px; border-radius: 70px; padding: 14px; position: relative;
    background: linear-gradient(145deg, #3a3a3c, #121214 40%, #1c1c1e 70%, #3a3a3c);
    box-shadow: 0 0 0 1.5px #5b5b5e inset, 0 40px 80px -30px rgba(30,20,20,.45), 0 8px 20px -8px rgba(0,0,0,.25);
  }
  .screen {
    width: 402px; height: 874px; border-radius: 56px; overflow: hidden; position: relative; color: var(--ink);
    background:
      radial-gradient(110% 55% at 85% -8%, var(--glow-top), transparent 62%),
      radial-gradient(95% 45% at 8% 108%, var(--glow-bot), transparent 62%),
      radial-gradient(60% 30% at 0% 45%, var(--glow-mid), transparent 70%),
      linear-gradient(180deg, var(--base1), var(--base2));
  }
  .contour { position: absolute; inset: 0; pointer-events: none; }
  .island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 50; }
  .homebar { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 138px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; z-index: 50; }
  .status { position: absolute; top: 0; inset-inline: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding-inline: 46px 34px; z-index: 40; font-weight: 600; font-size: 17px; }
  [dir=rtl] .status { padding-inline: 34px 46px; }
  .status .sys { display: flex; gap: 6px; align-items: center; direction: ltr; }
  .content { position: absolute; inset: 0; padding: 54px 20px 0; }

  /* ---------- glass ---------- */
  .glass {
    background: linear-gradient(180deg, var(--glass-hi), transparent 55%), var(--glass);
    -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
    box-shadow: inset 0 0 0 .6px var(--rim2), inset 0 1px 0 var(--rim), var(--shadow);
  }
  .glass { position: relative; }
  .glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.2px; pointer-events: none;
    background: linear-gradient(140deg, var(--edge1), transparent 32%, transparent 68%, var(--edge2));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .group { border-radius: 26px; overflow: hidden; }
  .group.glass { background: linear-gradient(180deg, var(--glass-hi), transparent 40%), var(--solid); }

  /* ---------- type ---------- */
  .toolbar { height: 52px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .cbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--ink); }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .02em; text-transform: uppercase; }
  [lang=ar] .eyebrow { text-transform: none; letter-spacing: 0; font-size: 14px; }
  .ltitle { font-size: 34px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
  .titlerow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .sec { font-size: 20px; font-weight: 700; margin: 22px 4px 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .sec small { font-size: 15px; font-weight: 500; color: var(--sub); }
  .num { font-variant-numeric: tabular-nums; }
  bdi { unicode-bidi: isolate; }

  /* ---------- rows ---------- */
  .row { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; inset-inline-start: var(--sep-start, 52px); inset-inline-end: 0; height: .6px; background: var(--sep); }
  .main { flex: 1; min-width: 0; }
  .t { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { font-size: 14px; color: var(--sub); margin-top: 2px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .late { color: var(--late); font-weight: 600; }
  .warn { color: var(--warn); font-weight: 600; }
  .chk { width: 24px; height: 24px; border-radius: 50%; border: 1.7px solid var(--sub2); flex: none; }
  .chev { color: var(--sub2); flex: none; }
  [dir=rtl] .chev, [dir=rtl] .flip { transform: scaleX(-1); }
  .tile { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 .5px rgba(0,0,0,.08); }
  .when { width: 50px; flex: none; display: flex; flex-direction: column; }
  .when b { font-size: 16px; font-weight: 600; }
  .when span { font-size: 13px; color: var(--sub); }
  .vbar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; margin-block: 4px; }
  .flag { color: var(--burg); flex: none; }
  .trail { text-align: end; flex: none; }
  .trail b { font-size: 16px; font-weight: 600; display: block; }
  .trail span { font-size: 13px; color: var(--sub); }
  .pay { font-size: 14px; font-weight: 600; color: var(--teal); background: var(--teal-soft); border-radius: 999px; padding: 5px 12px; display: inline-block; margin-top: 4px; }
  .paid { width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; flex: none; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }

  /* ---------- pills ---------- */
  .pills { display: flex; gap: 8px; margin-top: 16px; overflow: hidden; margin-inline: -20px; padding-inline: 20px; }
  .pill { height: 36px; padding-inline: 14px; border-radius: 18px; display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; white-space: nowrap; flex: none; }
  .pill.on { background: var(--teal); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 6px 16px -6px var(--teal); }

  /* ---------- hero ---------- */
  .hero { border-radius: 30px; padding: 18px 18px 16px; margin-top: 14px; }
  .big { font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .stats { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 14px; font-weight: 600; }
  .stat { display: flex; align-items: center; gap: 6px; }
  .next { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--sub); margin-top: 4px; }
  .next b { color: var(--ink); font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arc-lbl { font-size: 11px; font-weight: 600; fill: var(--sub2); }

  /* ---------- tab bar ---------- */
  .dock { position: absolute; inset-inline: 14px; bottom: 26px; display: flex; gap: 8px; z-index: 30; }
  .tabbar { flex: 1; height: 64px; border-radius: 32px; display: flex; padding: 5px; }
  .tab { flex: 1; min-width: 0; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--sub); }
  .tab.on { background: var(--sel); color: var(--ink); }
  .fab { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.32), transparent 55%), var(--burg);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 .6px rgba(255,255,255,.25), 0 12px 26px -8px var(--burg); }
  .fade-bottom { position: absolute; inset-inline: 0; bottom: 0; height: 140px; z-index: 20; pointer-events: none;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    -webkit-mask: linear-gradient(180deg, transparent, #000 55%); mask: linear-gradient(180deg, transparent, #000 55%);
    background: linear-gradient(180deg, transparent, var(--base2)); }

  /* ---------- buddy ---------- */
  .bud { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .bud .face { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; }
  .bud img, .bav img { width: 52px; image-rendering: pixelated; margin-top: 12px; }
  .badge { position: absolute; top: -2px; inset-inline-end: -2px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--burg); color: #fff;
    font-size: 13px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--base1); z-index: 2; }
  .bubble { padding: 10px 14px; border-radius: 20px; border-end-start-radius: 6px; font-size: 15px; font-weight: 500; max-width: 230px; margin-bottom: 26px; }

  /* ---------- sheet ---------- */
  .dimmer { position: absolute; inset: 0; background: var(--dim); z-index: 60; }
  .under { position: absolute; inset: 0; transform: scale(.93) translateY(6px); border-radius: 40px; overflow: hidden; filter: saturate(.9); }
  .sheet { position: absolute; inset: 64px 0 0; z-index: 70; border-radius: 40px 40px 0 0; padding: 8px 16px 0;
    background: var(--sheet); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--rim), 0 -10px 40px -10px rgba(0,0,0,.2); }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--sub2); opacity: .5; margin: 0 auto 6px; }
  .shead { display: flex; align-items: center; justify-content: space-between; height: 52px; margin-bottom: 8px; }
  .shead h2 { font-size: 17px; font-weight: 600; }
  .ok { background: radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.3), transparent 55%), var(--teal); color: #fff; }
  .sgroup { border-radius: 24px; background: var(--solid); margin-bottom: 18px; box-shadow: inset 0 0 0 .6px var(--rim2); }
  .sheet .sgroup { margin-bottom: 13px; } .sheet .sgroup .row { min-height: 48px; }
  .sgroup .row { min-height: 52px; }
  .lbl { font-size: 13px; color: var(--sub); margin: 0 18px 6px; text-transform: uppercase; letter-spacing: .02em; }
  .toggle { width: 52px; height: 32px; border-radius: 16px; background: var(--track); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .toggle.on { background: var(--teal); }
  .toggle.on::after { inset-inline-start: 22px; }
  .val { font-size: 15px; color: var(--teal); }
  .vgrey { font-size: 17px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .week { display: flex; gap: 6px; padding: 4px 14px 14px; }
  .wd { flex: 1; height: 40px; border-radius: 14px; display: grid; place-items: center; font-size: 14px; font-weight: 600; background: var(--sel); color: var(--sub); }
  .wd.on { background: var(--teal); color: #fff; }
  .field-t { font-size: 20px; font-weight: 600; }
  .link { color: var(--teal); }

  /* ---------- chat ---------- */
  .chat { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 22px; font-size: 16px; line-height: 1.45; }
  .msg.b { align-self: flex-start; border-end-start-radius: 7px; }
  .msg.u { align-self: flex-end; background: var(--user); color: var(--user-ink); border-end-end-radius: 7px; }
  .bav { width: 46px; height: 46px; border-radius: 17px; overflow: hidden; display: grid; place-items: center; flex: none; }
  .bav img { width: 38px; margin-top: 6px; }
  .mini { margin-top: 10px; border-radius: 16px; background: var(--sel); }
  .mini .row { min-height: 44px; padding: 8px 12px; --sep-start: 12px; }
  .mini .t { font-size: 15px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .chip { height: 38px; padding-inline: 14px; border-radius: 19px; display: flex; align-items: center; font-size: 15px; font-weight: 600; }
  .composer { position: absolute; inset-inline: 16px; bottom: 30px; display: flex; gap: 10px; align-items: center; }
  .composer .field { flex: 1; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: space-between; padding-inline: 18px 8px; color: var(--sub); font-size: 16px; }
  .send { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--sub); }
</style>

<script>
const IC = {
  moon: '<path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  today: '<path d="M3.5 17.5a8.5 8.5 0 0 1 17 0"/><path d="M2.5 20.5h19"/><circle cx="15.6" cy="11.4" r="1.9" fill="currentColor" stroke="none"/>',
  bills: '<rect x="5" y="2.8" width="14" height="18.4" rx="3.2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  spend: '<path d="M4 13a8 8 0 0 1 16 0"/><path d="M12 13l4-4"/><path d="M3 18.5h18"/>',
  more: '<circle cx="5.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M5.5 12.5l4.2 4.2L18.5 7.8"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  chev: '<path d="M9.5 6l6 6-6 6"/>',
  chevL: '<path d="M14.5 6l-6 6 6 6"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  repeat: '<path d="M17 3l3 3-3 3"/><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/>',
  bell: '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 21a2.2 2.2 0 0 0 4 0"/>',
  tag: '<path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8-9 9z"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/>',
  flag: '<path d="M5.5 21V4"/><path d="M5.5 4h11.5l-2.4 4 2.4 4H5.5" fill="currentColor"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  note: '<path d="M5 6.5h14M5 11.5h14M5 16.5h9"/>',
  days: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17"/><circle cx="8.5" cy="14.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="14.5" r="1.2" fill="currentColor"/>',
  food: '<path d="M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3"/><path d="M17.5 21V3c-2.2 1.2-3.5 4.2-3.5 8.5h3.5"/>',
  car: '<path d="M4.5 16.5v-4l2.2-5.2h10.6l2.2 5.2v4z"/><path d="M4.5 16.5v2.2M19.5 16.5v2.2M4.5 12.5h15"/><circle cx="8" cy="14.6" r=".9" fill="currentColor"/><circle cx="16" cy="14.6" r=".9" fill="currentColor"/>',
  fun: '<path d="M12 3.5l2.3 5.3 5.7.5-4.3 3.8 1.3 5.6-5-3-5 3 1.3-5.6L4 9.3l5.7-.5z"/>',
  gym: '<path d="M3 9.5v5M6 7v10M18 7v10M21 9.5v5M6 12h12"/>',
  home: '<path d="M4 11l8-7 8 7v9.5H4z"/><path d="M10 20.5V14.5h4v6"/>',
  wifi: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.8 16a4.8 4.8 0 0 1 6.4 0"/><circle cx="12" cy="19.3" r="1" fill="currentColor"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.2h2"/>',
  bolt: '<path d="M13 2.5L4.5 14h7l-1 7.5 8.5-11.5h-7z"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
};
const ic = (n, s = 22, w = 1.9, cls = '') =>
  `<svg class="${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

const C = { work: '#5B7FA6', project: '#B08143', personal: '#8A6BB0', study: '#7A8B3D',
  food: '#C2416E', car: '#D08A2E', health: '#3B6FD8', home: '#4E9583', fun: '#8A6BB0' };

/* ---------- shared pieces ---------- */
function contour(seed) {
  let p = '';
  for (let k = 0; k < 11; k++) {
    const r = 70 + k * 30; let d = '';
    for (let a = 0; a <= 360; a += 6) {
      const t = a * Math.PI / 180;
      const rr = r + 14 * Math.sin(3 * t + k * .5 + seed) + 9 * Math.cos(5 * t - k * .3);
      d += (a ? 'L' : 'M') + (300 + rr * Math.cos(t)).toFixed(1) + ' ' + (210 + rr * .82 * Math.sin(t)).toFixed(1);
    }
    p += `<path d="${d}Z"/>`;
  }
  return `<svg class="contour" viewBox="0 0 402 874" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="var(--contour)" stroke-width="1">${p}</g></svg>`;
}
function status(rtl) {
  return `<div class="status"><span class="num">9:41</span><span class="sys">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    ${ic('wifi', 18, 2.2)}
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.2" y="2.2" width="17" height="8.6" rx="2.4" fill="currentColor"/><rect x="25" y="4.3" width="1.6" height="4.4" rx=".8" fill="currentColor" opacity=".45"/></svg>

/* ---------- day arc (the app's signature shape) ---------- */
function dayArc(rtl, labels) {
  const W = 330, y0 = 78, sag = 62, half = 150, r = (half * half + sag * sag) / (2 * sag);
  const cx = W / 2, cy = y0 - sag + r;
  const a0 = Math.atan2(y0 - cy, cx - half - cx), a1 = Math.atan2(y0 - cy, half);
  const at = f => { const a = a0 + (a1 - a0) * f; let x = cx + r * Math.cos(a); if (rtl) x = W - x; return [x, cy + r * Math.sin(a)]; };
  const path = `M${rtl ? W - 15 : 15} ${y0} A${r.toFixed(1)} ${r.toFixed(1)} 0 0 ${rtl ? 0 : 1} ${rtl ? 15 : W - 15} ${y0}`;
  const now = (9 + 41 / 60 - 6) / 18;
  const [nx, ny] = at(now);
  const appts = [5 / 18, 13.5 / 18].map(f => at(f)).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="var(--base1)" stroke="var(--sub2)" stroke-width="2"/>`).join('');
  const lbl = [0, 1 / 3, 2 / 3, 1].map((f, i) => { const [x] = at(f); const anchor = i === 0 ? 'start' : i === 3 ? 'end' : 'middle'; const ax = rtl ? (anchor === 'start' ? 'end' : anchor === 'end' ? 'start' : 'middle') : anchor; return `<text class="arc-lbl" x="${x}" y="${y0 + 18}" text-anchor="${ax}">${labels[i]}</text>`; }).join('');
  return `<svg width="100%" viewBox="0 0 ${W} 100" style="display:block;margin-top:8px;overflow:visible">
    <path d="${path}" fill="none" stroke="var(--track)" stroke-width="7" stroke-linecap="round"/>
    <path d="${path}" fill="none" stroke="var(--teal)" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="${(now * 100).toFixed(1)} 200"/>
    ${appts}
    <circle cx="${nx}" cy="${ny}" r="12" fill="var(--burg)" opacity=".18"/>
    <circle cx="${nx}" cy="${ny}" r="7" fill="var(--burg)" stroke="var(--base1)" stroke-width="2.5"/>
    ${lbl}</svg>`;
}
