<!-- Yawmie: day blocks + setup concept (fake data). Open with #board or a single screen id. Nothing here is built in the demo yet. -->
<meta charset="utf-8">
<title>Yawmie Day Blocks</title>
<style>
  @font-face { font-family: YRound; src: local("SF Pro Rounded"), url("file:///System/Library/Fonts/SFNSRounded.ttf"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #E9E8E4; }
  body { font-family: ui-rounded, YRound, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: #0E0E0E;
    display: grid; grid-template-columns: repeat(4, 430px); gap: 56px 44px; justify-content: center; padding: 60px 50px; }
  figure { display: grid; gap: 14px; justify-items: center; }
  figcaption { font: 600 19px YRound, -apple-system; color: #2A2A2A; text-align: center; max-width: 420px; line-height: 1.35; }
  figcaption small { display: block; font-weight: 500; font-size: 15px; color: #5A5A5A; margin-top: 4px; }

  .phone { width: 430px; height: 902px; border-radius: 70px; padding: 14px; position: relative;
    background: linear-gradient(145deg, #3a3a3a, #121212 40%, #1c1c1c 70%, #3a3a3a); box-shadow: 0 0 0 1.5px #5b5b5b inset, 0 40px 80px -30px rgba(30, 20, 20, .45); }
  .scr { width: 402px; height: 874px; border-radius: 56px; overflow: hidden; position: relative; color: var(--ink);
    --ink: #0E0E0E; --sub: #6B6B69; --chip: #E6E6E2; --card: rgba(255, 255, 255, .78); --sep: rgba(14, 14, 14, .08); --teal: #0F8F7A; --burg: #7A1F2B; --late: #C2412D;
    background: radial-gradient(110% 50% at 85% -8%, rgba(15, 143, 122, .26), transparent 62%), radial-gradient(95% 45% at 8% 108%, rgba(122, 31, 43, .18), transparent 62%), #F4F4F2; }
  .scr.dark { --ink: #F4F4F2; --sub: #8C8C8A; --chip: #1C1C1C; --card: #1A1A1A; --sep: rgba(255, 255, 255, .08); --teal: #2BB59D; --burg: #C04459; background: #0B0B0B; }
  .island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 90; }
  .status { position: absolute; top: 0; inset-inline: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding-inline: 46px 34px; font: 600 17px YRound, -apple-system; z-index: 80; }
  .homebar { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 138px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 90; }
  .c { position: absolute; inset: 0; padding: 58px 20px 0; }
  .card { background: var(--card); border-radius: 26px; box-shadow: inset 0 0 0 .6px rgba(255, 255, 255, .9), 0 10px 28px -14px rgba(40, 24, 24, .25); }
  .dark .card { box-shadow: inset 0 0 0 .6px rgba(255, 255, 255, .07); }
  .row { display: flex; align-items: center; gap: 12px; }
  .sub { color: var(--sub); }
  .num { font-variant-numeric: tabular-nums; }
  svg { flex: none; }

  /* bar + greeting + next up (Today top) */
  .bar { display: flex; justify-content: space-between; align-items: center; height: 48px; }
  .pill { height: 44px; padding-inline: 14px; border-radius: 22px; background: var(--chip); display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
  .circ { width: 44px; height: 44px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 16px; font-weight: 700; }
  .greet { margin-top: 10px; font-size: 27px; font-weight: 600; line-height: 1.2; }
  .greet span { display: block; color: var(--sub); }
  .herowrap { position: relative; padding-top: 70px; }
  .peek { position: absolute; top: 0; inset-inline-end: 22px; width: 104px; }
  .hero { position: relative; background: #0E0E0E; color: #F4F4F2; border-radius: 26px; padding: 20px 22px; }
  .hero small { font-size: 13px; font-weight: 700; letter-spacing: .06em; color: #A3A3A0; }
  .hero h2 { font-size: 27px; line-height: 1.12; margin-top: 5px; }
  .hero .m { font-size: 15px; color: #A3A3A0; margin-top: 6px; }
  .go { margin-top: 14px; height: 44px; padding-inline: 18px; border-radius: 22px; background: #F4F4F2; color: #0E0E0E; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
  .add { margin-top: 16px; height: 58px; border-radius: 29px; display: flex; align-items: center; gap: 10px; padding-inline: 20px 6px; font-size: 17px; }
  .addbtn { margin-inline-start: auto; height: 46px; padding-inline: 16px 18px; border-radius: 23px; background: var(--burg); color: #fff; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; }
  .ring { box-shadow: 0 0 0 3px #F4F4F2, 0 0 0 6px var(--burg); }

  /* plan section */
  .ttl { font-size: 34px; font-weight: 700; letter-spacing: -.01em; display: flex; justify-content: space-between; align-items: baseline; }
  .ttl small { font-size: 16px; font-weight: 600; color: var(--sub); }
  .days { display: flex; gap: 6px; margin-top: 12px; }
  .d { flex: 1; height: 62px; border-radius: 18px; display: grid; place-items: center; align-content: center; gap: 1px; font-size: 12px; color: var(--sub); }
  .d b { font-size: 18px; color: var(--ink); }
  .d.on { background: #0E0E0E; color: #BDBDBD; } .d.on b { color: #fff; }
  .d i { display: flex; gap: 2px; height: 5px; } .d i u { width: 5px; height: 5px; border-radius: 50%; }
  .chips { display: flex; gap: 8px; margin: 12px -20px 0; padding-inline: 20px; overflow: hidden; }
  .chip { height: 36px; padding-inline: 13px; border-radius: 18px; background: var(--card); display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; white-space: nowrap; box-shadow: inset 0 0 0 .6px rgba(255, 255, 255, .9); }
  .chip.on { background: var(--teal); color: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  .tl { position: relative; margin-top: 16px; display: grid; gap: 10px; }
  .slot { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: start; }
  .tm { font-size: 13px; font-weight: 600; color: var(--sub); padding-top: 14px; text-align: end; }
  .blk { border-radius: 22px; overflow: hidden; background: color-mix(in srgb, var(--a) 13%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--a) 30%, transparent); }
  .bh { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .ico { width: 30px; height: 30px; border-radius: 10px; background: var(--a); color: #fff; display: grid; place-items: center; }
  .ico svg { stroke: #fff; }
  .bh b { font-size: 17px; } .bh span { font-size: 13px; color: var(--sub); display: block; font-weight: 500; }
  .bh .r { margin-inline-start: auto; font-size: 13px; font-weight: 700; color: var(--a); }
  .t { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 16px; }
  .t + .t { border-top: .6px solid var(--sep); }
  .ck { width: 22px; height: 22px; border-radius: 50%; border: 1.8px solid var(--a); flex: none; }
  .ck.sq { border-radius: 7px; }
  .tg { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: rgba(14, 14, 14, .07); white-space: nowrap; }
  .tg.late { background: var(--late); color: #fff; }
  .now { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: center; }
  .now .tm { padding: 0; color: var(--burg); font-weight: 800; }
  .now .ln { height: 2px; background: var(--burg); border-radius: 1px; position: relative; }
  .now .ln::before { content: ""; position: absolute; inset-inline-start: -5px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--burg); }
  .appt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 18px; background: var(--card); font-size: 16px; }
  .back { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--chip); color: var(--sub); display: inline-flex; gap: 4px; align-items: center; }

  /* dock without + */
  .dock { position: absolute; inset-inline: 14px; bottom: 24px; display: flex; gap: 8px; z-index: 60; }
  .bud { width: 66px; height: 66px; border-radius: 22px; overflow: hidden; background: #7A1F2B; border: 2px solid rgba(255, 255, 255, .6); flex: none; }
  .bud img, .tile img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
  .tabs { flex: 1; height: 66px; border-radius: 33px; background: rgba(255, 255, 255, .72); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); display: flex; padding: 5px; box-shadow: inset 0 0 0 .6px #fff, 0 10px 26px -12px rgba(0, 0, 0, .25); }
  .tab { flex: 1; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--sub); }
  .tab.on { background: rgba(14, 14, 14, .07); color: var(--ink); }

  /* sheet */
  .dim { position: absolute; inset: 0; background: rgba(20, 16, 16, .3); z-index: 70; }
  .sheet { position: absolute; inset: 70px 0 0; z-index: 75; border-radius: 38px 38px 0 0; background: #F6F6F4; padding: 8px 16px 0; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: #BDBDBD; margin: 0 auto 6px; }
  .sh { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .sh h2 { font-size: 18px; text-align: center; } .sh h2 span { display: block; font-size: 13px; color: var(--sub); font-weight: 500; }
  .wcard { background: #fff; border-radius: 26px; }
  .lbl { font-size: 13px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; margin: 18px 6px 8px; }
  .inp { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 16px; color: var(--sub); }
  .mv { margin-inline-start: auto; font-size: 14px; font-weight: 700; color: var(--teal); background: rgba(15, 143, 122, .12); padding: 5px 11px; border-radius: 14px; }
  .big { height: 56px; border-radius: 28px; background: #0E0E0E; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; }

  /* focus */
  .fx { position: absolute; inset: 0; padding: 60px 22px 0; display: grid; align-content: start; }
  .areachip { justify-self: center; margin-top: 20px; height: 34px; padding-inline: 14px; border-radius: 17px; background: #1C1C1C; display: inline-flex; gap: 8px; align-items: center; font-weight: 700; }
  .gauge { position: relative; margin-top: 18px; }
  .gauge .in { position: absolute; inset-inline: 0; bottom: 6px; text-align: center; }
  .gauge b { font-size: 64px; font-weight: 700; line-height: 1; display: block; letter-spacing: -.02em; }
  .gauge span { font-size: 16px; color: var(--sub); }
  .ftasks { margin-top: 26px; }
  .rest { text-align: center; color: var(--sub); font-size: 16px; margin-top: 22px; }

  /* setup */
  .steps { display: flex; gap: 6px; justify-content: center; margin-top: 18px; }
  .steps i { width: 26px; height: 5px; border-radius: 3px; background: #D6D6D2; } .steps i.on { background: #0E0E0E; }
  .tile { width: 128px; height: 128px; border-radius: 34px; overflow: hidden; background: #7A1F2B; border: 3px solid #fff; justify-self: center; margin-top: 40px; box-shadow: 0 18px 40px -14px rgba(122, 31, 43, .55); }
  .h1 { font-size: 34px; font-weight: 700; text-align: center; margin-top: 26px; line-height: 1.15; }
  .p { font-size: 17px; color: var(--sub); text-align: center; margin-top: 10px; line-height: 1.4; }
  .opt { height: 64px; border-radius: 22px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding-inline: 20px; font-size: 18px; font-weight: 600; margin-top: 12px; box-shadow: inset 0 0 0 1.5px transparent; }
  .opt.on { box-shadow: inset 0 0 0 2px #0E0E0E; }
  .rad { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #BDBDBD; } .opt.on .rad { border: 7px solid #0E0E0E; }
  .foot { position: absolute; inset-inline: 22px; bottom: 44px; display: grid; gap: 14px; justify-items: center; }
  .foot .big { width: 100%; }
  .foot a { font-size: 16px; font-weight: 600; color: var(--sub); }
  .tmpl { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .tmpl + .tmpl { border-top: .6px solid var(--sep); }
  .tmpl b { font-size: 17px; display: block; } .tmpl span { font-size: 14px; color: var(--sub); }

  /* tutorial */
  .spot { position: absolute; z-index: 72; border-radius: 26px; box-shadow: 0 0 0 9999px rgba(10, 8, 8, .62); }
  .tip { position: absolute; z-index: 74; inset-inline: 22px; background: #fff; border-radius: 24px; padding: 18px 18px 14px; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .4); }
  .tip b { font-size: 19px; display: block; } .tip p { font-size: 16px; color: var(--sub); margin-top: 6px; line-height: 1.4; }
  .tipf { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-weight: 600; }
  .tipf .nx { background: #0E0E0E; color: #fff; padding: 9px 18px; border-radius: 18px; }
</style>
<script>
const P = {
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  moon: '<path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6z"/>',
  check: '<path d="M5.5 12.5l4.2 4.2L18.5 7.8"/>', plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  flag: '<path d="M5.5 21V4"/><path d="M5.5 4h11.5l-2.4 4 2.4 4H5.5" fill="currentColor"/>', chev: '<path d="M9.5 6l6 6-6 6"/>',
  brief: '<rect x="3.5" y="7" width="17" height="12.5" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/>',
  rocket: '<path d="M12 15l-3-3c1.5-5 5-8 10-8 0 5-3 8.5-8 10z"/><path d="M9 12H5l2-4h4M12 15v4l4-2v-4"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20"/>',
  home: '<path d="M4 11l8-7 8 7v9.5H4z"/><path d="M10 20.5V14.5h4v6"/>',
  focus: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/>',
  ret: '<path d="M9 14l-5-5 5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  today: '<path d="M3.5 17.5a8.5 8.5 0 0 1 17 0"/><path d="M2.5 20.5h19"/><circle cx="15.6" cy="11.4" r="1.9" fill="currentColor" stroke="none"/>',
  bills: '<rect x="5" y="2.8" width="14" height="18.4" rx="3.2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  spend: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1" fill="currentColor"/>',
  more: '<circle cx="5.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor"/>',
};
const ic = (n, s = 20, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const A = { work: ['#5B7FA6', 'brief', 'Work'], project: ['#B08143', 'rocket', 'Project'], study: ['#7A8B3D', 'book', 'Study'], personal: ['#8A6BB0', 'home', 'Personal'] };
const BUD = '../buddy.png';
const status = (dark) => `<div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.2" y="2.2" width="17" height="8.6" rx="2.4" fill="currentColor"/></svg></span></div>`;
const phone = (inner, dark) => `<div class="phone"><div class="scr ${dark ? 'dark' : ''}">${inner}${status(dark)}<div class="island"></div><div class="homebar"></div></div></div>`;
const dock = () => `<div class="dock"><div class="bud"><img src="${BUD}"></div><div class="tabs">${[['today', 'Today'], ['bills', 'Bills'], ['spend', 'Spending'], ['more', 'More']].map(([k, l], i) => `<div class="tab ${i ? '' : 'on'}">${ic(k, 25, 1.9)}${l}</div>`).join('')}</div></div>`;
const blockHead = (k, time, right) => { const [c, i, n] = A[k]; return `<div class="bh"><span class="ico">${ic(i, 17)}</span><div><b>${n}</b><span class="num">${time}</span></div><span class="r">${right || ''}</span></div>`; };
const task = (k, title, tag, sq) => `<div class="t"><span class="ck ${sq ? 'sq' : ''}"></span><span style="flex:1">${title}</span>${tag || ''}</div>`;

/* 1. Today top: + moves into the page (Add bar) */
const s1 = phone(`<div class="c">
  <div class="bar"><span class="pill">${ic('cal', 18)}Sun, Nov 8</span><span style="display:flex;gap:10px"><span class="circ">${ic('moon', 19)}</span><span class="circ">ع</span></span></div>
  <div class="greet">Good afternoon<span>5 tasks left today · 1 overdue</span></div>
  <div class="herowrap"><img class="peek" src="${BUD}"><div class="hero"><small>NEXT UP</small><h2>Project block</h2><div class="m num">16:00 – 18:00 · 2 tasks</div><div class="go">${ic('focus', 18)}Start focus</div></div></div>
  <div class="add card"><span class="sub" style="flex:1">What's on your plate?</span><span class="addbtn ring">${ic('plus', 20, 2.6)}Add</span></div>
  <div class="ttl" style="margin-top:26px">Your day</div>
  <div style="height:150px;margin:6px -20px 0;position:relative"><div style="position:absolute;inset:20px -30px 0;filter:blur(30px);opacity:.42;background:radial-gradient(40% 70% at 12% 50%,#0F8F7A,transparent 70%),radial-gradient(45% 80% at 55% 55%,#7A1F2B,transparent 70%),radial-gradient(35% 70% at 92% 45%,#B7791F,transparent 70%)"></div>
    <div style="position:relative;display:flex;justify-content:space-between;padding:56px 20px 0" class="num"><div><b style="font-size:48px;font-weight:500;display:block">5</b>Left</div><div><b style="font-size:48px;font-weight:500;display:block">2</b>Appointments</div><div><b style="font-size:48px;font-weight:500;display:block;color:#C2412D">1</b>Late</div></div></div>
</div>${dock()}`);

/* 2. Plan section: dates + areas + blocks timeline + anytime */
const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d, i) => `<div class="d ${i ? '' : 'on'}">${d}<b class="num">${8 + i}</b><i>${[['#5B7FA6', '#B08143', '#7A8B3D'], ['#5B7FA6', '#B08143'], ['#5B7FA6'], ['#8A6BB0'], ['#5B7FA6', '#7A8B3D'], [], []][i].map(c => `<u style="background:${c}"></u>`).join('')}</i></div>`).join('');
const s2 = phone(`<div class="c" style="padding-top:62px">
  <div class="ttl">Plan<small>Sunday</small></div>
  <div class="days">${days}</div>
  <div class="chips"><span class="chip on">All</span><span class="chip" style="color:#7A1F2B">${ic('flag', 15)}Urgent</span>${['work', 'project', 'study', 'personal'].map(k => `<span class="chip"><i class="dot" style="background:${A[k][0]}"></i>${A[k][2]}</span>`).join('')}</div>
  <div class="tl">
    <div class="slot"><span class="tm num">9:00</span><div class="blk" style="--a:${A.work[0]}">${blockHead('work', '9:00 – 13:00', '2 / 3 done')}
      ${task('work', 'Review the monthly sales report', '<span class="tg late">2d late</span>')}${task('work', 'Marketing team meeting', '<span class="tg num">11:00</span>', true)}</div></div>
    <div class="now"><span class="tm num">14:10</span><div class="ln"></div></div>
    <div class="slot"><span class="tm num">16:00</span><div class="blk" style="--a:${A.project[0]}">${blockHead('project', '16:00 – 18:00', '0 / 2')}
      ${task('project', 'Write the launch post')}${task('project', 'December content plan')}</div></div>
    <div class="slot"><span class="tm num">19:30</span><div class="appt"><span class="ck sq" style="--a:${A.project[0]};border-color:${A.project[0]}"></span><span style="flex:1">Call with the designer</span><i class="dot" style="background:${A.project[0]}"></i><span class="sub" style="font-size:14px">Project</span></div></div>
    <div class="slot"><span class="tm num">21:00</span><div class="blk" style="--a:${A.study[0]}">${blockHead('study', '21:00 – 22:00 · daily', '0 / 1')}${task('study', 'Study chapter three')}</div></div>
    <div class="slot"><span class="tm">Any<br>time</span><div class="card" style="border-radius:22px">
      <div class="t" style="--a:${A.personal[0]}"><span class="ck" style="border-color:#8A6BB0"></span><span style="flex:1">Book car service</span><span style="color:#7A1F2B">${ic('flag', 16)}</span></div>
      <div class="t"><span class="ck" style="border-color:#5B7FA6"></span><span style="flex:1">Update the price list<br><span class="back">${ic('ret', 12, 2.4)}Back from Work</span></span></div></div></div>
  </div></div>${dock()}`);

/* 3. Block sheet */
