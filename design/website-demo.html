<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yawmie Website</title>
<meta name="description" content="Demo of the yawmie.me landing page with made-up data.">
<style>
/* Layout: one long page of calm chapters. The app's own screens are the imagery; the day arc is the signature shape. */
:root {
  --bg1: #F4F4F2; --bg2: #E8E8E4;
  --ink: #0E0E0E; --sub: #5A5A5A; --dim: #7A7A78;
  --line: rgba(14, 14, 14, .09);
  --glass: rgba(255, 255, 255, .55); --edge: rgba(255, 255, 255, .95);
  --card: #FBFBFA;
  --chip: rgba(14, 14, 14, .06); --track: rgba(14, 14, 14, .10);
  --hero: #0E0E0E; --hero-ink: #F4F4F2; --hero-sub: #A3A3A0; --hero-accent: #D07382;
  --burg: #7A1F2B; --burg-text: #7A1F2B; --on-burg: #FFFFFF;
  --teal: #0F8F7A; --teal-text: #0B6B5C; --on-teal: #FFFFFF;
  --warn: #B7791F; --over: #C2412D;
  --haze: rgba(122, 31, 43, .16);
  --bezel: #1B1B1B;
  --shadow: 0 30px 60px -30px rgba(40, 24, 24, .35), 0 1px 2px rgba(0, 0, 0, .05);
  --a-work: #5B7FA6; --a-project: #B08143; --a-personal: #8A6BB0; --a-study: #7A8B3D; --a-home: #4E9583; --a-food: #D08A2E;
  --font: ui-rounded, "SF Pro Rounded", "SF Arabic Rounded", -apple-system, BlinkMacSystemFont, "SF Arabic", "Geeza Pro", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #0B0B0B; --bg2: #111111; --ink: #F4F4F2; --sub: #BDBDBD; --dim: #8A8A88;
    --line: rgba(255, 255, 255, .09); --glass: #1A1A1A; --edge: rgba(255, 255, 255, .08); --card: #1A1A1A;
    --chip: rgba(255, 255, 255, .07); --track: rgba(255, 255, 255, .12);
    --hero: #F4F4F2; --hero-ink: #0E0E0E; --hero-sub: #6B6B69; --hero-accent: #7A1F2B;
    --burg: #C04459; --burg-text: #D07382; --teal: #2BB59D; --teal-text: #2BB59D; --on-teal: #0B0B0B;
    --warn: #E0A43A; --over: #EF6A52; --haze: rgba(192, 68, 89, .13); --bezel: #2A2A2A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #0B0B0B; --bg2: #111111; --ink: #F4F4F2; --sub: #BDBDBD; --dim: #8A8A88;
  --line: rgba(255, 255, 255, .09); --glass: #1A1A1A; --edge: rgba(255, 255, 255, .08); --card: #1A1A1A;
  --chip: rgba(255, 255, 255, .07); --track: rgba(255, 255, 255, .12);
  --hero: #F4F4F2; --hero-ink: #0E0E0E; --hero-sub: #6B6B69; --hero-accent: #7A1F2B;
  --burg: #C04459; --burg-text: #D07382; --teal: #2BB59D; --teal-text: #2BB59D; --on-teal: #0B0B0B;
  --warn: #E0A43A; --over: #EF6A52; --haze: rgba(192, 68, 89, .13); --bezel: #2A2A2A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg1); background-image: linear-gradient(var(--bg1), var(--bg2)); background-attachment: fixed; color: var(--ink); font: 17px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
main { overflow-x: clip; width: 100%; max-width: 100%; }
img { max-width: 100%; image-rendering: auto; }
svg { flex: none; }
a { color: inherit; }
bdi, .num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--burg); outline-offset: 3px; }
[dir="rtl"] .flip { transform: scaleX(-1); }

#waves { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
/* Side gutter is physical on purpose: it must clear the phone's own left/right safe areas. */
.wrap { max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.chapter { padding-block: clamp(96px, 14vw, 184px); }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--burg-text); }
.h2 { font-size: clamp(34px, 5vw, 64px); line-height: 1.04; letter-spacing: -.035em; font-weight: 800; margin: 12px 0 0; text-wrap: balance; max-width: 22ch; }
.lead { font-size: 20px; color: var(--sub); max-width: 58ch; margin: 18px 0 0; text-wrap: pretty; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding-inline: 26px; border-radius: 999px; font: 600 17px var(--font); text-decoration: none; border: 0; cursor: pointer; transition: transform .3s ease, filter .3s ease; }
.btn:hover { transform: translateY(-2px); }
.btn-burg { background: var(--burg); color: var(--on-burg); }
.btn-burg:hover { filter: brightness(1.1); }
.btn-ghost { background: var(--glass); color: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: var(--chip); color: var(--ink); border: 0; cursor: pointer; font: 700 15px var(--font); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- nav ---------- */
.nav { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 14px); inset-inline: 0; }
.nav-in { margin-inline: auto; max-width: 1080px; display: flex; align-items: center; gap: 8px; padding: 8px; padding-inline-start: 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); box-shadow: var(--shadow); }
.nav-wrap { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 20px; letter-spacing: -.02em; margin-inline-end: auto; }
.brand svg { width: 34px; height: 34px; }
.nav-links { display: flex; gap: 4px; }
.nav-links a { padding: 10px 14px; border-radius: 999px; text-decoration: none; color: var(--sub); font-size: 15px; font-weight: 600; }
.nav-links a:hover { color: var(--ink); background: var(--chip); }
.nav .btn { min-height: 44px; padding-inline: 18px; font-size: 15px; }
@media (max-width: 820px) { .nav-links { display: none; } }
@media (max-width: 440px) { .nav .btn span { display: none; } .nav .btn { padding-inline: 14px; } }

/* ---------- hero ---------- */
/* The hero is the character's room: always the brand burgundy (same in light and dark), matching his art. */
.hero { --room: #540618; --glow-x: 28%; position: relative; overflow: hidden; border-radius: 0 0 38px 38px; color: #F4F4F2; padding-top: calc(env(safe-area-inset-top, 0px) + 112px); background: radial-gradient(36% 58% at var(--glow-x) 64%, #8E2A3C 0%, transparent 72%), var(--room); }
[dir="ltr"] .hero { --glow-x: 72%; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); align-items: end; gap: 24px; }
.hero-copy { align-self: center; padding-bottom: 96px; }
.tagline { font-size: 20px; font-weight: 700; color: rgba(244, 244, 242, .75); }
.tagline span { color: #F2A7B4; }
.hero h1 { margin: 12px 0 0; font-size: clamp(40px, 4.9vw, 70px); line-height: 1.06; letter-spacing: -.04em; font-weight: 800; text-wrap: balance; }
.ipill { display: inline-block; width: 1.9em; height: .9em; border-radius: 999px; vertical-align: -.06em; margin-inline: .12em; position: relative; overflow: hidden; background: #0E0E0E; }
.ipill svg { position: absolute; inset: 16% 14% auto; width: 72%; }
.hero p { margin: 24px 0 0; max-width: 34em; font-size: 20px; color: rgba(244, 244, 242, .78); text-wrap: pretty; }
.ctas { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; }
.btn-light { background: #F4F4F2; color: #7A1F2B; }
.btn-line { background: transparent; color: #F4F4F2; border: 1px solid rgba(244, 244, 242, .4); }
.btn-line:hover { background: rgba(244, 244, 242, .08); }
.hero-buddy { position: relative; height: clamp(460px, 50vw, 660px); display: flex; justify-content: center; align-items: flex-end; }
.dayarc { position: absolute; left: 50%; top: 16%; width: min(118%, 640px); translate: -50% 0; overflow: visible; }
.dayarc text { font: 600 17px var(--font); fill: rgba(244, 244, 242, .55); }
.hero-buddy .px { position: absolute; width: 9px; height: 9px; background: rgba(244, 244, 242, .5); }
.hero-buddy .floor { position: absolute; bottom: 6px; left: 50%; translate: -50% 0; width: 46%; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, .3); filter: blur(6px); }
.bud { position: relative; z-index: 1; height: 100%; }
.bud img, .peek img { height: 100%; width: auto; max-width: none; display: block; }
[dir="ltr"] .bud img, [dir="ltr"] .peek img { transform: scaleX(-1); } /* he always gestures toward the text */
.bubble { position: absolute; z-index: 2; top: 3%; inset-inline-start: 0; max-width: 250px; padding: 14px 18px; border-radius: 22px; border-end-end-radius: 6px; background: #F4F4F2; color: #0E0E0E; font-size: 17px; font-weight: 700; line-height: 1.35; box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .5); }
.bubble small { display: block; font-size: 13px; font-weight: 600; color: #5A5A5A; margin-top: 4px; }
@media (max-width: 860px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr); }
  .hero-copy { padding-bottom: 8px; text-align: center; }
  .hero p { margin-inline: auto; }
  .ctas { justify-content: center; }
  .hero-buddy { height: 440px; }
  .bubble { max-width: 200px; font-size: 15px; inset-inline-start: 2%; }
}

/* ---------- phone + app screens ---------- */
.phone { width: 300px; max-width: 100%; aspect-ratio: 300 / 620; padding: 9px; border-radius: 48px; background: var(--bezel); box-shadow: 0 50px 80px -40px rgba(30, 10, 14, .55), inset 0 0 0 1.5px rgba(255, 255, 255, .08); flex: none; }
.screen { position: relative; height: 100%; border-radius: 40px; overflow: hidden; background: linear-gradient(var(--bg1), var(--bg2)); color: var(--ink); font-size: 13px; line-height: 1.35; text-align: start; }
.island { position: absolute; top: 10px; left: 50%; translate: -50% 0; width: 96px; height: 28px; border-radius: 999px; background: #000; z-index: 3; }
.sbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 28px 0; font-size: 13px; font-weight: 700; }
.sbar i { display: inline-block; width: 22px; height: 11px; border-radius: 4px; border: 1.5px solid currentColor; }
.s { padding: 18px 16px 0; display: flex; flex-direction: column; gap: 12px; }
.s-top { display: flex; justify-content: space-between; align-items: center; }
.s-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; background: var(--chip); font-size: 12px; font-weight: 600; }
.s-chip svg { width: 13px; height: 13px; }
.s-dot { width: 30px; height: 30px; border-radius: 999px; background: var(--chip); display: grid; place-items: center; }
.s-dot svg { width: 14px; height: 14px; }
.s-title { font-size: 28px; font-weight: 800; letter-spacing: -.03em; margin: 2px 0 0; }
.s-greet b { display: block; font-size: 20px; letter-spacing: -.02em; }
.s-greet span { font-size: 17px; font-weight: 700; color: var(--dim); }
.s-next { position: relative; background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 14px 16px; display: grid; gap: 3px; }
.s-next small { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--hero-sub); }
.s-next b { font-size: 17px; }
.s-next span { font-size: 12px; color: var(--hero-sub); }
.s-done { justify-self: start; margin-top: 6px; display: inline-flex; gap: 5px; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--hero-ink); color: var(--hero); font-style: normal; font-weight: 700; font-size: 12px; }
.s-done svg { width: 12px; height: 12px; }
.s-peek { position: absolute; width: 62px; inset-inline-end: 14px; top: -54px; }
.s-h { font-size: 20px; font-weight: 800; letter-spacing: -.02em; display: flex; justify-content: space-between; align-items: baseline; }
.s-h small { font-size: 13px; color: var(--dim); font-weight: 600; }
.s-card { background: var(--glass); border: 1px solid var(--edge); border-radius: 18px; overflow: hidden; }
.s-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.s-row + .s-row { border-top: 1px solid var(--line); }
.s-row .t { flex: 1; min-width: 0; }
.s-row .t b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-row .t span { font-size: 12px; color: var(--dim); }
.s-row .late { color: var(--over); }
.s-circ { width: 18px; height: 18px; border-radius: 999px; border: 1.6px solid var(--dim); flex: none; }
.s-circ.on { background: var(--teal); border-color: var(--teal); }
.s-sq { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.s-sq svg { width: 14px; height: 14px; }
.s-stats { display: flex; justify-content: space-between; margin-top: -26px; padding-inline: 4px; }
.s-stats div { text-align: center; }
.s-stats b { display: block; font-size: 22px; font-weight: 700; }
.s-stats span { font-size: 12px; color: var(--sub); }
.s-urgent { background: var(--burg); color: #fff; border-radius: 18px; padding: 12px; display: flex; gap: 10px; align-items: center; }
.s-urgent .s-circ { border-color: rgba(255, 255, 255, .7); }
.s-urgent span { font-size: 12px; opacity: .85; display: block; }
.s-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 2px; }
.s-week span { font-size: 12px; color: var(--dim); }
.s-week b { display: grid; place-items: center; width: 28px; height: 28px; margin: 3px auto 0; border-radius: 999px; font-size: 13px; }
.s-week b.on { background: var(--teal); color: var(--on-teal); }
.s-areas { display: flex; gap: 6px; }
.s-area { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; background: var(--chip); font-size: 12px; font-weight: 600; }
.s-area i, .ad { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }
.s-tl { display: grid; grid-template-columns: 40px 1fr; gap: 6px 8px; align-items: start; }
.s-tl > span { font-size: 12px; color: var(--dim); padding-top: 8px; }
.s-blk { border-radius: 14px; padding: 8px 10px; border-inline-start: 3px solid var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.s-blk b { display: block; font-size: 13px; }
.s-blk span { font-size: 12px; color: var(--sub); }
.s-blk.appt { background: var(--glass); border: 1px solid var(--edge); border-inline-start: 3px solid var(--c); }
.s-month { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 14px 16px; }
.s-month small { font-size: 12px; color: var(--hero-sub); font-weight: 600; }
.s-month b { display: block; font-size: 28px; letter-spacing: -.02em; margin: 2px 0; }
.s-month span { font-size: 12px; color: var(--hero-sub); }
.s-seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); padding: 3px; border-radius: 999px; text-align: center; font-size: 12px; font-weight: 600; }
.s-seg span { padding: 6px 0; border-radius: 999px; }
.s-seg .on { background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.s-safe { padding: 14px; text-align: center; }
.s-safe small { font-size: 12px; color: var(--sub); font-weight: 600; }
.s-safe b { display: block; font-size: 28px; letter-spacing: -.02em; }
.s-safe .arc { width: 76%; margin: 4px auto -6px; display: block; }
.s-safe span { font-size: 12px; color: var(--dim); }
.s-bub { max-width: 86%; padding: 10px 13px; border-radius: 22px; font-size: 13px; }
.s-bub.y { background: var(--glass); border: 1px solid var(--edge); border-end-start-radius: 8px; }
.s-bub.me { align-self: flex-end; background: var(--burg); color: #fff; border-end-end-radius: 8px; }
.s-who { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.s-who span { width: 34px; height: 34px; border-radius: 10px; background: var(--burg); overflow: hidden; display: grid; place-items: end center; }
.s-who img { width: 30px; }
.s-add { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.s-ok { width: 30px; height: 30px; border-radius: 999px; background: var(--teal); color: var(--on-teal); display: grid; place-items: center; flex: none; }
.s-ok svg { width: 15px; height: 15px; }
.s-qs { display: flex; gap: 6px; flex-wrap: wrap; }
.s-qs span { padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
.s-dock { position: absolute; inset: auto 12px 14px; display: flex; gap: 8px; align-items: center; }
.s-tile { width: 56px; height: 56px; border-radius: 22px; background: var(--burg); border: 2px solid rgba(255, 255, 255, .9); overflow: hidden; display: grid; place-items: end center; flex: none; }
.s-tile img { width: 48px; }
.s-tabs { flex: 1; height: 56px; border-radius: 999px; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; padding: 4px; box-shadow: var(--shadow); }
.s-tabs span { display: grid; justify-items: center; gap: 1px; font-size: 12px; font-weight: 600; color: var(--sub); border-radius: 999px; padding: 5px 0; }
.s-tabs span.on { background: var(--chip); color: var(--ink); }
.s-tabs svg { width: 17px; height: 17px; }
.arc { overflow: visible; }
[dir="rtl"] .arc { transform: scaleX(-1); }

/* ---------- accordion ---------- */
.acc { margin-top: 56px; display: flex; gap: 12px; height: 680px; }
.slice { position: relative; flex: 0 0 116px; overflow: hidden; border-radius: 26px; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: flex .7s cubic-bezier(.2, .8, .2, 1); }
.slice.on { flex: 1 1 auto; background: radial-gradient(48% 62% at 78% 60%, var(--haze), transparent 75%), var(--glass); }
[dir="rtl"] .slice.on { background: radial-gradient(48% 62% at 22% 60%, var(--haze), transparent 75%), var(--glass); }
.slice-head { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 22px 20px; background: none; border: 0; color: var(--ink); font: 700 17px var(--font); text-align: start; cursor: pointer; z-index: 1; }
.slice.on .slice-head { inset: 0 auto auto 0; pointer-events: none; }
[dir="rtl"] .slice.on .slice-head { inset: 0 0 auto auto; }
.slice-head .ico { width: 44px; height: 44px; border-radius: 14px; background: var(--chip); display: grid; place-items: center; }
.slice-head .ico.buddy { background: var(--burg); overflow: hidden; place-items: end center; }
.slice-head .ico.buddy img { width: 38px; }
.slice-head .ico svg { width: 22px; height: 22px; }
.slice.on .slice-head .lbl { opacity: 0; }
.slice-body { position: absolute; inset-block: 0; inset-inline-start: 0; width: max(100%, 720px); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 40px; padding: 40px 48px 40px 40px; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s .35s; }
[dir="rtl"] .slice-body { padding: 40px 40px 40px 48px; }
.slice.on .slice-body { opacity: 1; visibility: visible; transition: opacity .6s ease .25s, visibility 0s; }
.slice-body h3 { margin: 70px 0 0; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.05; letter-spacing: -.035em; font-weight: 800; }
.slice-body p { color: var(--sub); font-size: 20px; max-width: 30ch; margin: 14px 0 0; }
.slice-body .phone { width: 280px; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
.slice.on:hover .phone { transform: translateY(-8px) scale(1.02); }
@media (max-width: 860px) {
  .acc { flex-direction: column; height: auto; }
  .slice { flex: none; }
  .slice-head { position: relative; flex-direction: row; justify-content: flex-start; align-items: center; gap: 14px; padding: 16px; width: 100%; }
  .slice.on .slice-head, [dir="rtl"] .slice.on .slice-head { inset: auto; }
  .slice.on .slice-head .lbl { opacity: 1; }
  .slice-body { position: relative; inset: auto; width: auto; grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 24px; display: none; }
  .slice-body, [dir="rtl"] .slice-body { padding: 0 20px 28px; }
  .slice.on .slice-body { display: grid; }
  .slice-body h3 { margin-top: 0; }
  .slice-body p { margin-inline: auto; }
  .slice-body .phone { width: min(280px, 100%); }
}

/* ---------- stacking cards ---------- */
.stack { margin-top: 56px; display: grid; gap: 28px; padding-bottom: 40px; }

.scard .tag svg { width: 24px; height: 24px; }
.demo { display: grid; gap: 14px; padding: 24px; border-radius: 26px; background: linear-gradient(var(--bg1), var(--bg2)); border: 1px solid var(--line); font-size: 15px; min-width: 0; }
.qa { display: flex; align-items: center; gap: 10px; padding: 8px; padding-inline-start: 18px; border-radius: 999px; background: var(--glass); border: 1px solid var(--edge); }
.qa span { flex: 1; min-width: 0; font-weight: 600; }
.qa .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--burg); vertical-align: -.2em; margin-inline-start: 2px; animation: blink 1s steps(1) infinite; }
.qa em { font-style: normal; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; background: var(--burg); color: var(--on-burg); font-weight: 700; font-size: 15px; }
.qa em svg { width: 16px; height: 16px; }
.addc { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.addc .s-sq { width: 36px; height: 36px; border-radius: 10px; }
.addc .s-sq svg { width: 18px; height: 18px; }
.addc .t { flex: 1; min-width: 0; }
.addc .t b { display: block; font-size: 17px; }
.addc .t span { font-size: 13px; color: var(--sub); }
.addc .s-ok { width: 44px; height: 44px; }
.addc .s-ok svg { width: 20px; height: 20px; }
.hint { font-size: 13px; color: var(--dim); text-align: center; }
.mic { justify-self: center; position: relative; width: 84px; height: 84px; border-radius: 999px; background: var(--burg); color: var(--on-burg); display: grid; place-items: center; }
.mic svg { width: 34px; height: 34px; }
.mic::before, .mic::after { content: ""; position: absolute; inset: 0; border-radius: 999px; border: 2px solid var(--burg); animation: ring 2.2s ease-out infinite; }
.mic::after { animation-delay: 1.1s; }
.said { justify-self: center; text-align: center; font-size: 20px; font-weight: 700; max-width: 26ch; }
.sms { padding: 14px 16px; border-radius: 22px; border-end-start-radius: 8px; background: var(--chip); font-size: 15px; line-height: 1.45; max-width: 92%; }
.sms small { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
.found { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }

.demo .s-row .t b { font-size: 15px; }

@media (max-width: 820px) {

/* ---------- privacy ---------- */

/* ---------- start: one panel, Yawmie standing on the two choices ---------- */

.cta-head { align-self: end; padding-bottom: 32px; }

.cta-lead { margin: 18px 0 0; font-size: 20px; color: var(--hero-sub); max-width: 42ch; text-wrap: pretty; }
.cta-lead b { color: var(--hero-ink); }

.cta .choose { grid-column: 1 / -1; margin-top: 0; }
.cta .way { background: color-mix(in srgb, var(--hero-ink) 7%, transparent); border-color: color-mix(in srgb, var(--hero-ink) 12%, transparent); color: var(--hero-ink); backdrop-filter: none; -webkit-backdrop-filter: none; }
.cta .way h3 span, .cta .way ol { background: color-mix(in srgb, var(--hero-ink) 9%, transparent); }
.cta .way .how { color: var(--hero-sub); }
.cta .way ol b { background: var(--hero-ink); color: var(--hero); }
.cta .way li svg { color: var(--hero-accent); }
.cta-row { grid-column: 1 / -1; margin-top: 28px; display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; justify-content: center; }
.cta-row small { color: var(--hero-sub); font-size: 15px; }
.btn-gh { background: transparent; color: var(--hero-ink); border: 1px solid color-mix(in srgb, var(--hero-ink) 30%, transparent); }
.btn-gh:hover { background: color-mix(in srgb, var(--hero-ink) 8%, transparent); }

    document.getElementById('manifesto').innerHTML = html;
    var card = function (w) {
      return '<div class="way"><h3><span>' + IC[w.icon] + '</span>' + esc(w.h) + '</h3><p class="for">' + esc(w.for) + '</p>' +
        '<ul>' + w.li.map(function (l) { return '<li>' + IC.check + '<span>' + esc(l) + '</span></li>'; }).join('') + '</ul>' +
        '<div class="how">' + esc(t.howStart) + '</div><ol>' + w.steps.map(function (s, i) { return '<li><b class="num">' + (i + 1) + '</b><span>' + esc(s) + '</span></li>'; }).join('') + '</ol>' +
        '<div class="gap"></div><a class="btn btn-burg" href="' + WAY_URLS[w.url] + '">' + esc(w.btn) + '</a></div>';
    };
    document.getElementById('ways').innerHTML = card(t.ways[0]) + '<div class="or">' + esc(t.or) + '</div>' + card(t.ways[1]);
  }

  // ---------- theme, language, background ----------
  var root = document.documentElement;
  var darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  function isDark() { return root.dataset.theme ? root.dataset.theme === 'dark' : darkMq.matches; }
  function syncButtons() {
    var tb = document.getElementById('themeBtn'), lb = document.getElementById('langBtn');
    tb.innerHTML = isDark() ? IC.sun : IC.moon;
    tb.setAttribute('aria-label', isDark() ? 'Light mode' : 'Dark mode');
    lb.textContent = lang === 'ar' ? 'EN' : 'ع';
    lb.setAttribute('aria-label', lang === 'ar' ? 'English' : 'العربية');
  }
  // Fine contour lines from the brand kit (ferashayf.com texture), same as the app demo.
  var WAVE_LINES = 40;
  function drawWaves() {
    var c = document.getElementById('waves'), w = innerWidth, h = innerHeight, dpr = devicePixelRatio || 1, ctx = c.getContext('2d');
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = getComputedStyle(root).getPropertyValue('--ink').trim(); ctx.globalAlpha = isDark() ? 0.08 : 0.09; ctx.lineWidth = 0.6;
    for (var i = 0; i < WAVE_LINES; i++) {
      var base = h * 0.05 + i * (h * 0.95 / WAVE_LINES);
      ctx.beginPath();
      for (var x = 0; x <= w; x += 4) {
        var t = x / w, y = base + Math.sin(t * 4.2 + i * 0.2) * (14 + i * 0.7) + Math.cos(t * 2.1 - i * 0.13) * 18;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // ---------- motion (GSAP). Reduced motion keeps the finished, static page. ----------
  var mm = null;
  function motion() {
    if (!window.gsap || !window.ScrollTrigger) return; // CDN missing: page stays complete and static
    gsap.registerPlugin(ScrollTrigger);
    mm = gsap.matchMedia();
    mm.add('(prefers-reduced-motion: no-preference)', function () {
      gsap.from('.hero-copy > *', { y: 28, duration: 1, stagger: 0.08, ease: 'power3.out' });
      gsap.from('.bud', { y: 120, duration: 1.3, ease: 'power3.out' });
      gsap.fromTo({ t: 0 }, { t: 0 }, { t: DAY.now, duration: 2, delay: 0.3, ease: 'power2.inOut', onUpdate: function () { renderDayArc(this.targets()[0].t); } });
      gsap.from('.giant', { yPercent: 40, ease: 'none', scrollTrigger: { trigger: 'footer', start: 'top bottom', end: 'bottom bottom', scrub: true } });
      gsap.from('.bubble', { scale: 0.4, y: 30, duration: 0.7, delay: 0.9, ease: 'back.out(1.8)', transformOrigin: '50% 100%' });
      gsap.to('.bud', { y: -10, duration: 2.4, delay: 1.3, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.to('.hero-buddy .px', { y: -18, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: -1, stagger: 0.5 });
      gsap.to('.hero-buddy', { yPercent: 12, ease: 'none', scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true } });


      var cards = gsap.utils.toArray('.scard');
      cards.forEach(function (card, i) {
        if (i === cards.length - 1) return;
        var tl = gsap.timeline({ scrollTrigger: { trigger: cards[i + 1], start: 'top bottom', end: 'top 30%', scrub: true } });
        tl.to(card, { scale: 0.93 - (cards.length - 2 - i) * 0.02, ease: 'none' }, 0)
          .to(card.querySelector('.shade'), { opacity: 0.55, ease: 'none' }, 0);
      });

      gsap.fromTo('#manifesto .w', { opacity: 0.16 }, { opacity: 1, stagger: 0.05, ease: 'none', scrollTrigger: { trigger: '#manifesto', start: 'top 78%', end: 'bottom 45%', scrub: true } });
    });
  }

  function apply() {
    if (mm) mm.revert();
    root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
    var t = L();
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll('[data-t-alt]').forEach(function (el) { el.alt = t[el.dataset.tAlt]; });
    document.querySelectorAll('[data-screen]').forEach(function (el) { el.innerHTML = SCREENS[el.dataset.screen](t.s); });
    renderViz(); renderDayArc(); renderAcc();
    document.querySelectorAll('[data-gh]').forEach(function (a) { a.href = GITHUB_URL; }); renderStack(); renderPrivacy(); syncButtons();
    motion();
  }

  document.getElementById('langBtn').addEventListener('click', function () { lang = lang === 'ar' ? 'en' : 'ar'; apply(); });
  document.getElementById('themeBtn').addEventListener('click', function () { root.dataset.theme = isDark() ? 'light' : 'dark'; syncButtons(); drawWaves(); });
  darkMq.addEventListener('change', function () { syncButtons(); drawWaves(); });
  var acc = document.getElementById('acc');
  acc.addEventListener('click', function (e) { var s = e.target.closest('.slice'); if (s) setAcc(+s.dataset.i); });
  acc.addEventListener('focusin', function (e) { var s = e.target.closest('.slice'); if (s) setAcc(+s.dataset.i); });
  acc.addEventListener('mouseover', function (e) {
    if (!matchMedia('(hover: hover) and (min-width: 861px)').matches) return;
    var s = e.target.closest('.slice'); if (s) setAcc(+s.dataset.i);
  });
  addEventListener('resize', drawWaves);

  apply();
  drawWaves();
})();
</script>
</body>
